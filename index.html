<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ARROW HUNT</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#dff3ff;
}

#game{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:500px;
    overflow:hidden;
    background:
        linear-gradient(#8fd3ff 0%,#dff6ff 65%,#8bcf72 65%,#5da64c 100%);
}

/* TOP UI */

#ui{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:30;
    pointer-events:none;
}

.panel{
    background:rgba(255,255,255,.85);
    padding:8px 12px;
    border-radius:12px;
    font-weight:bold;
    font-size:16px;
}

/* TARGET */

#target{
    position:absolute;
    left:50%;
    top:23%;
    transform:translateX(-50%);
    width:105px;
    height:105px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            #222 0 12%,
            #fff 12% 25%,
            #d33 25% 40%,
            #fff 40% 55%,
            #d33 55% 72%,
            #fff 72% 100%
        );
    border:4px solid #222;
    box-shadow:0 5px 12px rgba(0,0,0,.25);
    z-index:8;
}

/* ARROW */

#arrow{
    position:absolute;
    left:50%;
    bottom:125px;
    width:190px;
    height:10px;
    transform:translateX(-50%) rotate(0deg);
    transform-origin:left center;
    z-index:20;
    touch-action:none;
    cursor:grab;
}

#arrow.dragging{
    cursor:grabbing;
}

/* Arrow shaft */

#arrow::before{
    content:"";
    position:absolute;
    left:0;
    top:3px;
    width:175px;
    height:5px;
    background:#6b3f20;
    border-radius:5px;
}

/* Arrow head */

#arrow::after{
    content:"➤";
    position:absolute;
    right:0;
    top:-11px;
    font-size:29px;
    line-height:30px;
    color:#222;
}

/* Feathers */

#arrow .feather{
    position:absolute;
    left:5px;
    top:-5px;
    width:20px;
    height:18px;
    border-left:4px solid #444;
    border-bottom:3px solid #444;
    transform:skew(-25deg);
}

/* FLYING ARROW */

.flying{
    position:absolute;
    display:none;
    width:190px;
    height:10px;
    transform-origin:left center;
    z-index:25;
    pointer-events:none;
}

.flying::before{
    content:"";
    position:absolute;
    left:0;
    top:3px;
    width:175px;
    height:5px;
    background:#6b3f20;
    border-radius:5px;
}

.flying::after{
    content:"➤";
    position:absolute;
    right:0;
    top:-11px;
    font-size:29px;
    line-height:30px;
    color:#222;
}

/* MESSAGE */

#message{
    position:absolute;
    left:50%;
    top:43%;
    transform:translate(-50%,-50%);
    padding:12px 20px;
    border-radius:15px;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:22px;
    font-weight:bold;
    text-align:center;
    z-index:40;
    display:none;
    white-space:nowrap;
}

/* PLAY BUTTON */

#play{
    position:absolute;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    width:170px;
    height:52px;
    border:0;
    border-radius:15px;
    background:#222;
    color:white;
    font-size:21px;
    font-weight:bold;
    z-index:35;
    touch-action:manipulation;
}

#play:active{
    transform:translateX(-50%) scale(.96);
}

/* INSTRUCTIONS */

#hint{
    position:absolute;
    left:50%;
    bottom:88px;
    transform:translateX(-50%);
    width:90%;
    text-align:center;
    font-size:14px;
    font-weight:bold;
    color:#222;
    z-index:15;
    pointer-events:none;
}

/* HIT EFFECT */

.hit{
    animation:hit .25s ease-out;
}

@keyframes hit{
    0%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-50%) scale(1.15);}
    100%{transform:translateX(-50%) scale(1);}
}

@media(max-height:600px){
    #target{
        top:18%;
        width:85px;
        height:85px;
    }

    #arrow{
        bottom:105px;
    }

    #play{
        bottom:15px;
    }

    #hint{
        bottom:70px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="ui">
        <div class="panel">
            Score: <span id="score">0</span>
        </div>

        <div class="panel">
            Shots: <span id="shots">0</span>
        </div>
    </div>

    <div id="target"></div>

    <div id="arrow">
        <div class="feather"></div>
    </div>

    <div id="flyingArrow"></div>

    <div id="message"></div>

    <div id="hint">
        Drag the arrow back, aim, then release
    </div>

    <button id="play">PLAY</button>

</div>

<script>

const game = document.getElementById("game");
const arrow = document.getElementById("arrow");
const flyingArrow = document.getElementById("flyingArrow");
const target = document.getElementById("target");
const playButton = document.getElementById("play");
const message = document.getElementById("message");
const scoreText = document.getElementById("score");
const shotsText = document.getElementById("shots");

let score = 0;
let shots = 0;
let playing = false;
let dragging = false;
let flying = false;

let startX = 0;
let startY = 0;

let currentX = 0;
let currentY = 0;

let aimAngle = 0;
let power = 0;

let animationId = null;


/* -------------------------
   START GAME
------------------------- */

function startGame(){

    score = 0;
    shots = 0;

    scoreText.textContent = score;
    shotsText.textContent = shots;

    playing = true;
    flying = false;

    arrow.style.display = "block";
    flyingArrow.style.display = "none";

    playButton.style.display = "none";
    message.style.display = "none";

    resetArrow();

}


/* -------------------------
   RESET ARROW
------------------------- */

function resetArrow(){

    const rect = game.getBoundingClientRect();

    startX = rect.width / 2;
    startY = rect.height - 125;

    currentX = startX;
    currentY = startY;

    aimAngle = 0;
    power = 0;

    arrow.style.left = startX + "px";
    arrow.style.top = startY + "px";

    arrow.style.transform =
        "translateX(0) rotate(0deg)";

    arrow.style.display = "block";

    flying = false;
    dragging = false;
}


/* -------------------------
   POINTER DOWN
------------------------- */

arrow.addEventListener("pointerdown", function(e){

    if(!playing || flying) return;

    e.preventDefault();

    dragging = true;

    arrow.classList.add("dragging");

    arrow.setPointerCapture(e.pointerId);

});


/* -------------------------
   POINTER MOVE
------------------------- */

arrow.addEventListener("pointermove", function(e){

    if(!dragging || flying || !playing) return;

    e.preventDefault();

    const rect = game.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    /*
       Arrow starts at bottom center.
       We calculate the pull vector.
    */

    let dx = startX - x;
    let dy = startY - y;

    /*
       Limit maximum pull distance.
    */

    const maxPull = 150;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if(distance > maxPull){

        dx = dx / distance * maxPull;
        dy = dy / distance * maxPull;

    }

    /*
       Pull position.
    */

    currentX = startX - dx;
    currentY = startY - dy;

    /*
       Shooting direction is opposite
       to the pull direction.
    */

    const shootX = dx;
    const shootY = dy;

    aimAngle =
        Math.atan2(shootY, shootX) * 180 / Math.PI;

    /*
       Power from pull distance.
    */

    power = Math.min(distance / maxPull, 1);

    /*
       Keep arrow visible while dragging.
    */

    arrow.style.left = currentX + "px";
    arrow.style.top = currentY + "px";

    arrow.style.transform =
        "rotate(" + aimAngle + "deg)";

});


/* -------------------------
   POINTER UP = SHOOT
------------------------- */

arrow.addEventListener("pointerup", function(e){

    if(!dragging || flying || !playing) return;

    e.preventDefault();

    dragging = false;

    arrow.classList.remove("dragging");

    /*
       Very small pull = cancel shot.
    */

    if(power < 0.08){

        resetArrow();
        return;

    }

    shootArrow();

});


/* -------------------------
   POINTER CANCEL
------------------------- */

arrow.addEventListener("pointercancel", function(){

    if(!dragging) return;

    dragging = false;

    arrow.classList.remove("dragging");

    resetArrow();

});


/* -------------------------
   SHOOT ARROW
------------------------- */

function shootArrow(){

    flying = true;

    shots++;

    shotsText.textContent = shots;

    /*
       Hide original arrow.
    */

    arrow.style.display = "none";

    /*
       Get starting position.
    */

    const gameRect = game.getBoundingClientRect();

    let x = startX;
    let y = startY;

    /*
       Convert aim angle to radians.
    */

    const radians =
        aimAngle * Math.PI / 180;

    /*
       Arrow speed depends on power.
    */

    const minSpeed = 650;
    const maxSpeed = 1450;

    const speed =
        minSpeed +
        (maxSpeed - minSpeed) * power;

    /*
       Initial velocity.
    */

    let vx = Math.cos(radians) * speed;
    let vy = Math.sin(radians) * speed;

    /*
       Gravity.
    */

    const gravity = 1050;

    /*
       Flying arrow.
    */

    flyingArrow.style.display = "block";

    flyingArrow.style.left = x + "px";
    flyingArrow.style.top = y + "px";

    let lastTime = performance.now();

    function animate(now){

        if(!flying) return;

        const dt =
            Math.min((now - lastTime) / 1000, 0.033);

        lastTime = now;

        /*
           Gravity.
        */

        vy += gravity * dt;

        /*
           Movement.
        */

        x += vx * dt;
        y += vy * dt;

        /*
           Direction of flight.
        */

        const flightAngle =
            Math.atan2(vy, vx) * 180 / Math.PI;

        /*
           Update arrow.
        */

        flyingArrow.style.left = x + "px";
        flyingArrow.style.top = y + "px";

        flyingArrow.style.transform =
            "rotate(" + flightAngle + "deg)";

        /*
           Collision.
        */

        if(checkTargetHit(x, y)){

            hitTarget(x, y);

            return;
        }

        /*
           Outside screen.
        */

        if(
            x < -250 ||
            x > gameRect.width + 250 ||
            y < -250 ||
            y > gameRect.height + 250
        ){

            missShot();

            return;
        }

        animationId =
            requestAnimationFrame(animate);
    }

    animationId =
        requestAnimationFrame(animate);
}


/* -------------------------
   TARGET COLLISION
------------------------- */

function checkTargetHit(x, y){

    const gameRect =
        game.getBoundingClientRect();

    const targetRect =
        target.getBoundingClientRect();

    const tx =
        targetRect.left -
        gameRect.left +
        targetRect.width / 2;

    const ty =
        targetRect.top -
        gameRect.top +
        targetRect.height / 2;

    const radius =
        targetRect.width / 2;

    const dx = x - tx;
    const dy = y - ty;

    const distance =
        Math.sqrt(dx * dx + dy * dy);

    return distance <= radius;

}


/* -------------------------
   HIT
------------------------- */

function hitTarget(x,y){

    flying = false;

    if(animationId){
        cancelAnimationFrame(animationId);
    }

    /*
       Score based on distance
       from bullseye.
    */

    const gameRect =
        game.getBoundingClientRect();

    const targetRect =
        target.getBoundingClientRect();

    const tx =
        targetRect.left -
        gameRect.left +
        targetRect.width / 2;

    const ty =
        targetRect.top -
        gameRect.top +
        targetRect.height / 2;

    const dx = x - tx;
    const dy = y - ty;

    const distance =
        Math.sqrt(dx * dx + dy * dy);

    const radius =
        targetRect.width / 2;

    let points = 10;

    if(distance < radius * .15){
        points = 100;
    }
    else if(distance < radius * .3){
        points = 75;
    }
    else if(distance < radius * .5){
        points = 50;
    }
    else if(distance < radius * .75){
        points = 25;
    }

    score += points;

    scoreText.textContent = score;

    target.classList.remove("hit");

    void target.offsetWidth;

    target.classList.add("hit");

    message.textContent =
        "+" + points + "  HIT!";

    message.style.display = "block";

    setTimeout(function(){

        message.style.display = "none";

        flyingArrow.style.display = "none";

        resetArrow();

    },700);

}


/* -------------------------
   MISS
------------------------- */

function missShot(){

    flying = false;

    if(animationId){
        cancelAnimationFrame(animationId);
    }

    flyingArrow.style.display = "none";

    message.textContent = "MISS";

    message.style.display = "block";

    setTimeout(function(){

        message.style.display = "none";

        resetArrow();

    },500);

}


/* -------------------------
   PLAY
------------------------- */

playButton.addEventListener("click", function(){

    startGame();

});


/* -------------------------
   INITIAL
------------------------- */

playing = false;

arrow.style.display = "none";

playButton.style.display = "block";

</script>

</body>
</html>
